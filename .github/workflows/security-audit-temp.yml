name: Temporary npm security audit

on:
  push:
    branches:
      - agent/deps-ci-next-proxy

permissions:
  contents: read

concurrency:
  group: npm-security-audit-temp
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev || true

      - name: Full dependency audit
        run: npm audit || true
