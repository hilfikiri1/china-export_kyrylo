name: Dependency refresh

on:
  push:
    branches:
      - agent/deps-ci-next-proxy

permissions:
  contents: write

concurrency:
  group: dependency-refresh-agent
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Upgrade framework dependencies
        run: |
          npm install --save-exact next@16.2.12 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact eslint-config-next@16.2.12

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh transitive dependencies [deps-refresh]"
          git push
