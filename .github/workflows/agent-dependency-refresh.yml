name: Agent dependency refresh

on:
  push:
    branches:
      - agent/security-audit-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-audit-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched dependencies
        run: |
          npm install --save-exact next@16.2.12 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact eslint-config-next@16.2.12

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update patched Next.js and React dependencies"
          git push origin HEAD:agent/security-audit-hardening
